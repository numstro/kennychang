<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kenny Chang</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      height: 100dvh;
      display: grid;
      grid-template-rows: 1fr auto;
    }

    .hero {
      position: relative;
      overflow: hidden;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center bottom;
      display: block;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.05) 50%, rgba(0,0,0,0.55));
    }

    footer {
      background: #0a0a0a;
      color: #f5f5f5;
      padding: 2.5rem 2rem;
    }

    .inner {
      max-width: 640px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.6rem;
    }

    p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #a3a3a3;
    }

    p + p {
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>
  <div class="hero">
    <img src="hero.jpg" alt="" />
  </div>
  <footer>
    <div class="inner">
      <h1>Kenny Chang</h1>
      <p>Not for sale. Nothing else here.</p>
    </div>
  </footer>
</body>
</html>
